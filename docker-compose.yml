name: funq-admin

services:
  admin:
    build:
      context: .
      target: development

    ports:
      - "23005:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development

    networks:
      - funq-network

    labels:
      - "com.funq.project=true"
      - "com.funq.name=admin"

    restart: unless-stopped

networks:
  funq-network:
    name: funq-network
    external: true
