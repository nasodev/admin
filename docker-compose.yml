name: funq-admin

services:
  admin:
    build:
      context: .
      target: development

    ports:
      - "23005:23005"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development

    labels:
      - "com.funq.project=true"
      - "com.funq.name=admin"

    restart: unless-stopped
